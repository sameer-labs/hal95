# HAL95 Worker — Cloudflare Workers configuration.
#
# Wrangler bundles worker.js together with the persona imported from
# ../js/persona.js, so the system prompt exists in exactly one place.
#
# Secrets are NOT stored here. Set the one secret once with:
#   wrangler secret put DEEPSEEK_API_KEY
#
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "hal95-worker"
main = "worker.js"
compatibility_date = "2025-01-01"

# The Worker is served at https://hal95-worker.<your-subdomain>.workers.dev
workers_dev = true

# Optional: a custom domain instead of workers.dev.
# routes = [
#   { pattern = "api.example.com/*", custom_domain = true }
# ]

# Durable, cross-isolate rate limiting (20 chat/min + 5 draws/min per IP,
# 1,500 weighted units per UTC day globally; a drawing weighs two units).
# Created with: wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "066f9c161cf845ecaf61e5c4ae25289d"

# Optional local development values. Prefer a .dev.vars file (git-ignored)
# over plain-text vars here, since this file is committed.
#
# [vars]
# LOG_LEVEL = "debug"
